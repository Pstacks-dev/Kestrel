services:
  kestrel-worker-rust:
    build:
      context: .
      dockerfile: docker/worker-rust.Dockerfile
    image: kestrel-worker-rust:local
    container_name: kestrel-worker-rust
    restart: unless-stopped
    env_file:
      - .env.worker
    environment:
      KESTREL_WORKER_WORKDIR: /var/lib/kestrel/work
      KESTREL_WORKER_HOST_WORKDIR: ${KESTREL_WORKER_HOST_WORKDIR:-/srv/kestrel-worker/work}
      KESTREL_DOCKER_BIN: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KESTREL_WORKER_HOST_WORKDIR:-/srv/kestrel-worker/work}:/var/lib/kestrel/work
    init: true
    stop_grace_period: 30s
