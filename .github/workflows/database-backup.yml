name: Kestrel Database Backup

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kestrel-database-backup
  cancel-in-progress: false

jobs:
  encrypted-backup:
    name: Encrypted offsite backup and verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install PostgreSQL 18 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Install dependencies
        run: npm ci

      - name: Create encrypted database backup
        id: backup
        env:
          PG_DUMP_BIN: /usr/lib/postgresql/18/bin/pg_dump
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KESTREL_BACKUP_STORAGE_URL: ${{ secrets.KESTREL_BACKUP_STORAGE_URL }}
          KESTREL_BACKUP_STORAGE_SERVICE_ROLE_KEY: ${{ secrets.KESTREL_BACKUP_STORAGE_SERVICE_ROLE_KEY }}
          KESTREL_BACKUP_ENCRYPTION_KEY: ${{ secrets.KESTREL_BACKUP_ENCRYPTION_KEY }}
          KESTREL_BACKUP_BUCKET: ${{ vars.KESTREL_BACKUP_BUCKET }}
        run: npm run backup:db

      - name: Download, decrypt and verify uploaded archive
        env:
          PG_RESTORE_BIN: /usr/lib/postgresql/18/bin/pg_restore
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KESTREL_BACKUP_STORAGE_URL: ${{ secrets.KESTREL_BACKUP_STORAGE_URL }}
          KESTREL_BACKUP_STORAGE_SERVICE_ROLE_KEY: ${{ secrets.KESTREL_BACKUP_STORAGE_SERVICE_ROLE_KEY }}
          KESTREL_BACKUP_ENCRYPTION_KEY: ${{ secrets.KESTREL_BACKUP_ENCRYPTION_KEY }}
          KESTREL_BACKUP_BUCKET: ${{ vars.KESTREL_BACKUP_BUCKET }}
          KESTREL_BACKUP_OBJECT_KEY: ${{ steps.backup.outputs.object_key }}
        run: npm run backup:verify

      - name: Restore drill into isolated staging database
        env:
          PG_RESTORE_BIN: /usr/lib/postgresql/18/bin/pg_restore
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          KESTREL_BACKUP_STORAGE_URL: ${{ secrets.KESTREL_BACKUP_STORAGE_URL }}
          KESTREL_BACKUP_STORAGE_SERVICE_ROLE_KEY: ${{ secrets.KESTREL_BACKUP_STORAGE_SERVICE_ROLE_KEY }}
          KESTREL_BACKUP_ENCRYPTION_KEY: ${{ secrets.KESTREL_BACKUP_ENCRYPTION_KEY }}
          KESTREL_BACKUP_BUCKET: ${{ vars.KESTREL_BACKUP_BUCKET }}
          KESTREL_BACKUP_OBJECT_KEY: ${{ steps.backup.outputs.object_key }}
          KESTREL_RESTORE_DATABASE_URL: ${{ secrets.KESTREL_RESTORE_DATABASE_URL }}
          KESTREL_RESTORE_CONFIRM: RESTORE_TO_STAGING_DATABASE
        run: |
          if [ -n "$KESTREL_RESTORE_DATABASE_URL" ]; then
            npm run backup:verify
          else
            echo "::warning::KESTREL_RESTORE_DATABASE_URL is not configured; archive integrity was verified, but the staging restore drill was skipped."
          fi
