name: Kestrel CI

on:
  push:
    branches: [main, production-hardening, client-release-hardening]
  pull_request:
    branches: [main, production-hardening]

permissions:
  contents: read

concurrency:
  group: kestrel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Report dependency security advisories
        run: |
          npm audit --json > npm-audit.json || true
          node --input-type=commonjs -e "const audit=require('./npm-audit.json'); const rows=Object.entries(audit.vulnerabilities || {}).map(([name, item]) => ({name, severity:item.severity, direct:item.isDirect, range:item.range, fixAvailable:item.fixAvailable, advisories:(item.via || []).filter(v => typeof v === 'object').map(v => v.title)})); console.log(JSON.stringify({metadata:audit.metadata?.vulnerabilities, packages:rows}, null, 2));"
      - name: Syntax-check server and worker entrypoints
        run: node --check server/control-plane.mjs && node --check server/lib/release-routes.mjs && node --check server/lib/netlify-deploy.mjs && node --check worker/agent.mjs
      - name: Type-check
        run: npm run lint
      - name: Build frontend
        run: npm run build
