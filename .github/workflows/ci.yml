name: Kestrel CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, production-hardening]

permissions:
  contents: read

concurrency:
  group: kestrel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check and production build
        run: npm run check

      - name: Run automated tests
        run: npm test
