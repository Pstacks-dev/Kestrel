name: Kestrel CI

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kestrel-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build frontend
        run: npm run build
