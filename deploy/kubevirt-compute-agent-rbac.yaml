apiVersion: v1
kind: ServiceAccount
metadata:
  name: kestrel-compute-agent
  namespace: kestrel-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kestrel-compute-agent
  namespace: kestrel-workloads
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachines/start", "virtualmachines/stop"]
    verbs: ["update"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinesnapshots"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["snapshot.kubevirt.io"]
    resources: ["virtualmachinerestores"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kestrel-compute-agent
  namespace: kestrel-workloads
subjects:
  - kind: ServiceAccount
    name: kestrel-compute-agent
    namespace: kestrel-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kestrel-compute-agent
